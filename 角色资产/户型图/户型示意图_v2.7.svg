<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1050" viewBox="0 0 1320 1050" font-family="PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif">
  <defs>
    <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#D8D2C6" stroke-width="2.2"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B45309"/>
    </marker>
  </defs>

  <rect width="1320" height="1050" fill="#FBF7F1"/>

  <!-- 标题 -->
  <text x="90" y="56" font-size="26" font-weight="700" fill="#3E352B">阿森家 · 全屋户型示意图</text>
  <text x="90" y="82" font-size="12.5" fill="#8A7C68">v2.7 ｜ 依据实际户型图 IMG_1619 重画 ｜ 单位：米 ｜ 与附录 A 一致 ｜ 玄关 / 卫生间已放开为可拍区 · 地板断点四处</text>

  <!-- ============ 房间 ============ -->

  <!-- 阳台 -->
  <rect x="90" y="150" width="252" height="136.8" rx="3" fill="#EDE4D6" stroke="#C0AE94" stroke-width="1.6"/>
  <text x="216" y="196" font-size="14.5" font-weight="700" fill="#3E352B" text-anchor="middle">阳台（晾晒）</text>
  <text x="216" y="216" font-size="10.5" fill="#7A6C59" text-anchor="middle">3.5×1.9 · 6.7㎡ · 暖米色防滑砖</text>
  <text x="216" y="232" font-size="10.5" fill="#7A6C59" text-anchor="middle">洗衣柜 · 晾衣杆 · 只作背景</text>

  <!-- 客厅 -->
  <rect x="90" y="301.2" width="252" height="259.2" rx="3" fill="#F5E3CA" stroke="#C0AE94" stroke-width="1.6"/>
  <text x="216" y="352" font-size="17" font-weight="700" fill="#3E352B" text-anchor="middle">客厅</text>
  <text x="216" y="374" font-size="10.5" fill="#7A6C59" text-anchor="middle">3.5×3.6 · 12.6㎡</text>
  <text x="216" y="391" font-size="10.5" fill="#7A6C59" text-anchor="middle">沙发贴南墙 · 沙发前爬行垫</text>
  <rect x="165" y="400" width="89" height="80" fill="#EFD5B4" stroke="#D3B183" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="209.5" y="444" font-size="9.5" fill="#8A6B42" text-anchor="middle">爬行垫 1.5m</text>

  <!-- 餐厅 -->
  <rect x="90" y="560.4" width="230.4" height="230.4" rx="3" fill="#F8EEDD" stroke="#C0AE94" stroke-width="1.6"/>
  <text x="205" y="626" font-size="16" font-weight="700" fill="#3E352B" text-anchor="middle">餐厅</text>
  <text x="205" y="647" font-size="10.5" fill="#7A6C59" text-anchor="middle">3.2×3.2 · 10.2㎡</text>
  <text x="205" y="664" font-size="10.5" fill="#7A6C59" text-anchor="middle">餐桌 + 3 把椅子 · 暖光吊灯</text>
  <text x="205" y="681" font-size="10.5" fill="#7A6C59" text-anchor="middle">东侧敞开 → 玄关（南）+ 西厨（北）</text>
  <text x="205" y="698" font-size="10.5" fill="#7A6C59" text-anchor="middle">北墙实墙（背后是卫生间）</text>

  <!-- 玄关（可拍 · 背景） -->
  <rect x="90" y="798" width="100.8" height="172.8" rx="3" fill="#F6E8D2" stroke="#C08B4E" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="140" y="908" font-size="11.5" font-weight="700" fill="#3E352B" text-anchor="middle">玄关</text>
  <text x="140" y="922" font-size="7.5" fill="#7A6C59" text-anchor="middle">1.4×2.4 · 3.4㎡</text>
  <text x="140" y="934" font-size="7.5" fill="#7A6C59" text-anchor="middle">鞋柜贴东墙</text>
  <text x="140" y="946" font-size="7.5" fill="#7A6C59" text-anchor="middle">无外窗 · 只靠餐厅透光</text>
  <text x="140" y="959" font-size="7.5" font-weight="700" fill="#B45309" text-anchor="middle">可拍 · 只作背景</text>

  <!-- 西厨 -->
  <rect x="190.8" y="798" width="129.6" height="172.8" rx="3" fill="#F2E2CB" stroke="#C0AE94" stroke-width="1.6"/>
  <text x="255" y="868" font-size="15" font-weight="700" fill="#3E352B" text-anchor="middle">西厨</text>
  <text x="255" y="888" font-size="10.5" fill="#7A6C59" text-anchor="middle">1.8×2.4 · 4.3㎡</text>
  <text x="255" y="905" font-size="10.5" fill="#7A6C59" text-anchor="middle">进厨房的必经之路</text>

  <!-- 厨房 -->
  <rect x="342" y="826.8" width="136.8" height="144" rx="3" fill="#F2E2CB" stroke="#C0AE94" stroke-width="1.6"/>
  <text x="410" y="882" font-size="15" font-weight="700" fill="#3E352B" text-anchor="middle">厨房</text>
  <text x="410" y="902" font-size="10.5" fill="#7A6C59" text-anchor="middle">1.9×2.0 · 3.8㎡</text>
  <text x="410" y="919" font-size="10.5" fill="#7A6C59" text-anchor="middle">只拍门口，不拍内部</text>

  <!-- 儿童房（不拍） -->
  <rect x="356.4" y="150" width="172.8" height="288" rx="3" fill="#EFEDE7" stroke="#C0AE94" stroke-width="1.6"/>
  <rect x="356.4" y="150" width="172.8" height="288" rx="3" fill="url(#hatch)" opacity="0.55"/>
  <text x="443" y="286" font-size="15" font-weight="700" fill="#6E685E" text-anchor="middle">儿童房</text>
  <text x="443" y="307" font-size="10.5" fill="#8C867C" text-anchor="middle">2.4×4.0 · 不拍、不设定</text>

  <!-- 主卧 -->
  <rect x="550.8" y="150" width="266.4" height="295.2" rx="3" fill="#F8E9D5" stroke="#C0AE94" stroke-width="1.6"/>
  <text x="644" y="238" font-size="17" font-weight="700" fill="#3E352B" text-anchor="middle">主卧</text>
  <text x="644" y="260" font-size="10.5" fill="#7A6C59" text-anchor="middle">3.7×4.1 · 15.2㎡</text>
  <text x="644" y="277" font-size="10.5" fill="#7A6C59" text-anchor="middle">西面整面平窗 · 东墙通顶衣柜</text>
  <text x="644" y="294" font-size="10.5" fill="#7A6C59" text-anchor="middle">床东 80cm 过道 · 书桌贴南墙</text>

  <!-- 走廊 -->
  <rect x="342" y="452.4" width="280.8" height="86.4" rx="3" fill="#F0E1C9" stroke="#C0AE94" stroke-width="1.6"/>
  <text x="483" y="482" font-size="15" font-weight="700" fill="#3E352B" text-anchor="middle">走廊</text>
  <text x="483" y="500" font-size="10" fill="#7A6C59" text-anchor="middle">3.9×1.2 · 东西向直廊 · 两侧墙全空</text>

  <!-- 卫生间（可拍 · 暗卫） -->
  <rect x="356.4" y="560.4" width="144" height="223.2" rx="3" fill="#F3EAD9" stroke="#C08B4E" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="428" y="606" font-size="14" font-weight="700" fill="#3E352B" text-anchor="middle">卫生间</text>
  <text x="428" y="624" font-size="9.5" fill="#7A6C59" text-anchor="middle">2.0×3.1 · 6.2㎡ · 暗卫</text>
  <text x="428" y="639" font-size="9.5" fill="#7A6C59" text-anchor="middle">台盆柜贴南墙 · 马桶贴北墙</text>
  <text x="428" y="654" font-size="9.5" fill="#8A6B42" text-anchor="middle">无外窗 · 镜前灯是唯一光源</text>
  <text x="428" y="700" font-size="8.5" font-weight="700" fill="#B45309" text-anchor="middle">可拍 · 宝宝戏须大人全程在</text>
  <!-- 淋浴区 -->
  <rect x="414" y="711.6" width="86.4" height="72" fill="#EEE3D2" stroke="#D3B183" stroke-width="1.4" stroke-dasharray="4 3"/>
  <path d="M414 711.6 L500.4 711.6" stroke="#A7BCC4" stroke-width="2.4"/>
  <text x="457.2" y="742" font-size="9" fill="#8A6B42" text-anchor="middle">淋浴区</text>
  <text x="457.2" y="756" font-size="8.5" fill="#8A6B42" text-anchor="middle">1.2×1.0</text>

  <!-- 次卧（不拍） -->
  <rect x="550.8" y="560.4" width="244.8" height="230.4" rx="3" fill="#EFEDE7" stroke="#C0AE94" stroke-width="1.6"/>
  <rect x="550.8" y="560.4" width="244.8" height="230.4" rx="3" fill="url(#hatch)" opacity="0.55"/>
  <text x="673" y="662" font-size="14" fill="#6E685E" text-anchor="middle">次卧</text>
  <text x="673" y="683" font-size="10.5" fill="#8C867C" text-anchor="middle">3.4×3.2 · 不拍</text>

  <!-- ============ 墙体（房间之间的填充带） ============ -->
  <g fill="#D9CBB4">
    <!-- 阳台/客厅：D3 两侧墙垛 -->
    <rect x="90" y="286.8" width="14.4" height="14.4"/>
    <rect x="291.6" y="286.8" width="50.4" height="14.4"/>
    <!-- 阳台/儿童房之间 -->
    <rect x="342" y="150" width="14.4" height="136.8"/>
    <!-- 儿童房/主卧 -->
    <rect x="529.2" y="150" width="21.6" height="302.4"/>
    <!-- 儿童房/走廊：D6 两侧 -->
    <rect x="356.4" y="438" width="64.8" height="14.4"/>
    <rect x="478.8" y="438" width="50.4" height="14.4"/>
    <!-- 主卧/走廊：D1 两侧 -->
    <rect x="550.8" y="445.2" width="21.6" height="7.2"/>
    <rect x="630" y="445.2" width="187.2" height="7.2"/>
    <!-- 走廊/卫生间+次卧：D7、D8 两侧 -->
    <rect x="342" y="538.8" width="72" height="21.6"/>
    <rect x="471.6" y="538.8" width="93.6" height="21.6"/>
    <rect x="622.8" y="538.8" width="172.8" height="21.6"/>
    <!-- 西厨/厨房：D5 两侧 -->
    <rect x="320.4" y="798" width="21.6" height="72"/>
    <rect x="320.4" y="927.6" width="21.6" height="43.2"/>
    <!-- 玄关/西厨 之间的北侧隔墙（v 9.20–11.60，u=1.60） -->
    <rect x="190.8" y="798" width="7.2" height="172.8"/>
    <!-- 卫生间/次卧 -->
    <rect x="500.4" y="560.4" width="50.4" height="223.2"/>
  </g>

  <!-- ============ 地板断点（四处，同一款 5cm 石材收边条） ============ -->
  <!-- ① 阳台口 D3：木地板 ↔ 阳台砖 -->
  <path d="M104.4 300.6 L291.6 300.6" stroke="#C98F4A" stroke-width="2.2" stroke-dasharray="3 3"/>
  <!-- ③ 餐厅 ↔ 玄关：木地板 ↔ 玄关砖（v=9.10–9.20） -->
  <path d="M90 794.4 L190.8 794.4" stroke="#C98F4A" stroke-width="2.4"/>
  <!-- ④ 卫生间门槛 D7 -->
  <path d="M414 552 L471.6 552" stroke="#C98F4A" stroke-width="2.2" stroke-dasharray="3 3"/>

  <!-- ============ 门与开口 ============ -->
  <!-- D3 阳台口 260 敞开 -->
  <rect x="104.4" y="297.6" width="187.2" height="7.2" fill="#FBF7F1"/>
  <text x="198" y="294" font-size="9.5" fill="#8A7C68" text-anchor="middle">D3 阳台口 260 敞开 ①断点</text>

  <!-- D4 餐厅口 整面敞开 -->
  <rect x="90" y="556.8" width="230.4" height="7.2" fill="#FBF7F1"/>
  <text x="205" y="553" font-size="9.5" fill="#8A7C68" text-anchor="middle">D4 餐厅口 320 整面敞开</text>

  <!-- 餐厅东敞开口：北段接西厨（敞开）、南段接玄关（敞开） -->
  <rect x="90" y="790.8" width="230.4" height="7.2" fill="#FBF7F1"/>
  <text x="196" y="782" font-size="9" font-weight="700" fill="#C98F4A">③ 5cm 收边条</text>

  <!-- D2 走廊口 120 敞开 -->
  <rect x="338.4" y="452.4" width="7.2" height="86.4" fill="#FBF7F1"/>
  <text x="333" y="446" font-size="9.5" fill="#8A7C68" text-anchor="middle">D2 走廊口 120 敞开</text>

  <!-- D1 卧室门 80，常年开 30 -->
  <rect x="572.4" y="441.6" width="57.6" height="7.2" fill="#FBF7F1"/>
  <path d="M572.4 445.2 L572.4 387.6" stroke="#A08D74" stroke-width="2.4"/>
  <path d="M630 445.2 A57.6 57.6 0 0 0 572.4 387.6" fill="none" stroke="#C4B49A" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="640" y="380" font-size="9.5" fill="#8A7C68">D1 卧室门 80（常年开 30）</text>

  <!-- D5 厨房推拉门 80，常开一半 -->
  <rect x="338.4" y="870" width="7.2" height="57.6" fill="#FBF7F1"/>
  <path d="M342 870 L342 898.8" stroke="#A08D74" stroke-width="2.6"/>
  <path d="M346.4 898.8 L346.4 927.6" stroke="#A08D74" stroke-width="2.6"/>
  <text x="352" y="864" font-size="9" fill="#8A7C68">D5 推拉门 80（常开一半）</text>

  <!-- D6 儿童房门：永远关严 -->
  <path d="M421.2 445.2 L478.8 445.2" stroke="#A08D74" stroke-width="2.6"/>
  <path d="M421.2 439 L421.2 451.4 M478.8 439 L478.8 451.4" stroke="#A08D74" stroke-width="1.4"/>
  <text x="450" y="434" font-size="9" fill="#9A8B76" text-anchor="middle">D6 关</text>

  <!-- D7 卫生间门：平时关严，拍卫生间时开 60 -->
  <path d="M414 549.6 L471.6 549.6" stroke="#A08D74" stroke-width="2.6"/>
  <path d="M414 543.4 L414 555.8 M471.6 543.4 L471.6 555.8" stroke="#A08D74" stroke-width="1.4"/>
  <text x="442.8" y="534" font-size="9" fill="#B45309" text-anchor="middle">D7 平时关 · 拍时开 60</text>

  <!-- D8 次卧门：永远关严 -->
  <path d="M565.2 549.6 L622.8 549.6" stroke="#A08D74" stroke-width="2.6"/>
  <path d="M565.2 543.4 L565.2 555.8 M622.8 543.4 L622.8 555.8" stroke="#A08D74" stroke-width="1.4"/>
  <text x="594" y="534" font-size="9" fill="#9A8B76" text-anchor="middle">D8 关</text>

  <!-- D9 入户门：南侧外墙（u=0.20）、v 9.60–10.50、朝北开、常年关严 -->
  <rect x="86.4" y="826.8" width="7.2" height="64.8" fill="#FBF7F1"/>
  <path d="M90 826.8 L154.8 826.8" stroke="#A08D74" stroke-width="2.6"/>
  <path d="M154.8 826.8 A64.8 64.8 0 0 1 90 891.6" fill="none" stroke="#C4B49A" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="92" y="988" font-size="9" fill="#B45309">D9 入户门 90 · 朝北开进玄关 · 常年关严</text>

  <!-- ============ 窗（玻璃）—— 全部平直，无弧形 ============ -->
  <!-- 南向长窗：图纸左边一整面，阳台→客厅→餐厅，直角转角，中间不断开 -->
  <path d="M90 790.8 L90 150" stroke="#A7BCC4" stroke-width="3.6"/>
  <!-- 阳台西端整面平直落地玻璃窗（三扇 · 与南向长窗在左上角成直角） -->
  <path d="M90 150 L342 150" stroke="#A7BCC4" stroke-width="3.6"/>
  <path d="M174 150 L174 164 M258 150 L258 164" stroke="#A7BCC4" stroke-width="2"/>
  <text x="216" y="136" font-size="10.5" fill="#5E7C88" text-anchor="middle">阳台西端平直落地玻璃窗（宽 3.5 · 三扇）</text>
  <!-- 主卧西面整面平窗（三扇 · 窗台高 40） -->
  <path d="M576 150 L792 150" stroke="#A7BCC4" stroke-width="3.6"/>
  <path d="M648 150 L648 164 M720 150 L720 164" stroke="#A7BCC4" stroke-width="2"/>
  <text x="684" y="114" font-size="10.5" fill="#5E7C88" text-anchor="middle">主卧西面整面平窗（宽 3 米 · 三扇 · 窗台高 40）</text>
  <!-- 厨房东窗 -->
  <path d="M372 970.8 L429.6 970.8" stroke="#A7BCC4" stroke-width="5"/>
  <text x="400" y="992" font-size="10" fill="#5E7C88" text-anchor="middle">厨房东窗 80</text>
  <!-- 儿童房西窗（不拍） -->
  <path d="M380 150 L510 150" stroke="#C6D3D8" stroke-width="3"/>
  <!-- 次卧北窗（不拍） -->
  <path d="M580 736.8 L768 736.8" stroke="#C6D3D8" stroke-width="3"/>

  <!-- 南向长窗标注（竖排） -->
  <text x="60" y="640" font-size="10.5" fill="#5E7C88" text-anchor="middle" transform="rotate(-90 60 640)">南向长窗 · 上午 10 点光从这一整面进来（全屋主采光面）</text>

  <!-- 玄关 / 卫生间 无外窗提示 -->

  <!-- ============ 动线① 主卧 → 客厅 ============ -->
  <path d="M750 200 L750 424 L601 424 L601 512 L300 512 L235 486"
        fill="none" stroke="#B45309" stroke-width="2.4" stroke-dasharray="9 6"
        marker-end="url(#arrow)" opacity="0.92"/>
  <g font-size="10.5" font-weight="700" fill="#FFFFFF">
    <circle cx="750" cy="296" r="10" fill="#B45309"/><text x="750" y="300" text-anchor="middle">1</text>
    <circle cx="596" cy="424" r="10" fill="#B45309"/><text x="596" y="428" text-anchor="middle">2</text>
    <circle cx="470" cy="512" r="10" fill="#B45309"/><text x="470" y="516" text-anchor="middle">3</text>
    <circle cx="300" cy="512" r="10" fill="#B45309"/><text x="300" y="516" text-anchor="middle">4</text>
  </g>

  <!-- ============ 右侧图例 ============ -->
  <rect x="848" y="140" width="432" height="838" rx="10" fill="#F7F2E8" stroke="#E6DBC7"/>

  <text x="872" y="172" font-size="13.5" font-weight="700" fill="#3E352B">图例</text>
  <rect x="872" y="184" width="16" height="12" rx="2" fill="#F5E3CA" stroke="#C0AE94"/>
  <text x="898" y="194" font-size="10.5" fill="#5A4F41">拍摄区（主景 · 要出资产图）</text>
  <rect x="872" y="204" width="16" height="12" rx="2" fill="#F6E8D2" stroke="#C08B4E" stroke-dasharray="4 2.5"/>
  <text x="898" y="214" font-size="10.5" fill="#5A4F41">可拍 · 只作背景（玄关 / 卫生间）</text>
  <rect x="872" y="224" width="16" height="12" rx="2" fill="#EFEDE7" stroke="#C0AE94"/>
  <rect x="872" y="224" width="16" height="12" rx="2" fill="url(#hatch)" opacity="0.6"/>
  <text x="898" y="234" font-size="10.5" fill="#5A4F41">不拍区（永远不进画面）</text>
  <rect x="872" y="244" width="16" height="12" rx="2" fill="#D9CBB4"/>
  <text x="898" y="254" font-size="10.5" fill="#5A4F41">墙</text>
  <rect x="872" y="264" width="16" height="4" fill="#A7BCC4"/>
  <text x="898" y="271" font-size="10.5" fill="#5A4F41">窗 / 玻璃（全屋无弧形）</text>
  <rect x="872" y="282" width="16" height="4" fill="#C98F4A"/>
  <text x="898" y="289" font-size="10.5" fill="#5A4F41">地板断点 · 5cm 石材收边条</text>
  <path d="M872 304 L888 304" stroke="#B45309" stroke-width="2.4" stroke-dasharray="6 4"/>
  <text x="898" y="308" font-size="10.5" fill="#5A4F41">走位动线（本图只画了①）</text>

  <path d="M872 322 L1256 322" stroke="#E6DBC7"/>

  <text x="872" y="346" font-size="12.5" font-weight="700" fill="#3E352B">方位口径</text>
  <text x="872" y="368" font-size="10.5" fill="#5A4F41">图纸上方 = 西 · 下方 = 东</text>
  <text x="872" y="385" font-size="10.5" fill="#5A4F41">图纸左侧 = 南 · 右侧 = 北</text>
  <text x="872" y="404" font-size="10" fill="#7A6C59">南向长窗是全屋主采光面；主卧是西面整面平窗。</text>
  <text x="872" y="421" font-size="10" fill="#B45309" font-weight="700">全屋不做弧形：两处窗都是平直矩形、直墙直角。</text>
  <text x="872" y="438" font-size="10" fill="#B45309" font-weight="700">玄关与卫生间都没有外窗，不许给它们补一扇窗。</text>

  <path d="M872 452 L1256 452" stroke="#E6DBC7"/>

  <text x="872" y="476" font-size="12.5" font-weight="700" fill="#3E352B">会进画面的开口（7 个）</text>
  <text x="872" y="497" font-size="10.5" fill="#5A4F41">D1 卧室门 80 · 常年开 30</text>
  <text x="872" y="514" font-size="10.5" fill="#5A4F41">D2 走廊口 120 · 敞开</text>
  <text x="872" y="531" font-size="10.5" fill="#5A4F41">D3 阳台口 260 · 敞开（① 断点）</text>
  <text x="872" y="548" font-size="10.5" fill="#5A4F41">D4 餐厅口 320 · 整面敞开</text>
  <text x="872" y="565" font-size="10.5" fill="#5A4F41">D5 厨房推拉门 80 · 常开一半（② 断点）</text>
  <text x="872" y="582" font-size="10.5" fill="#5A4F41">D7 卫生间门 80 · 平时关、拍时开 60（④ 断点）</text>
  <text x="872" y="599" font-size="10.5" fill="#5A4F41">D9 入户门 90 · 常年关严、拍玄关时可见</text>
  <text x="872" y="620" font-size="10" fill="#8C867C">永远关着（2 扇）：D6 儿童房 · D8 次卧</text>

  <path d="M872 634 L1256 634" stroke="#E6DBC7"/>

  <text x="872" y="658" font-size="12.5" font-weight="700" fill="#3E352B">动线① 主卧 → 客厅（虚线）</text>
  <text x="872" y="679" font-size="10.5" fill="#5A4F41">① 床边往图纸下方 1 步，进床东过道</text>
  <text x="872" y="696" font-size="10.5" fill="#5A4F41">② 沿过道再 2 步，走到卧室门口</text>
  <text x="872" y="713" font-size="10.5" fill="#5A4F41">③ 出门右转，沿走廊直走 5 步</text>
  <text x="872" y="730" font-size="10.5" fill="#5A4F41">④ 走廊西端直接进客厅 2 步</text>
  <text x="872" y="749" font-size="10" fill="#B45309" font-weight="700">约 7 米 / 10 步，只转一次身</text>

  <path d="M872 763 L1256 763" stroke="#E6DBC7"/>

  <text x="872" y="787" font-size="12.5" font-weight="700" fill="#3E352B">地板断点四处（同一款收边条）</text>
  <text x="872" y="808" font-size="10.5" fill="#5A4F41">① 阳台口 D3 · 阳台铺暖米色防滑砖</text>
  <text x="872" y="825" font-size="10.5" fill="#5A4F41">② 厨房门内 D5 · 切在门内侧，不停门槛</text>
  <text x="872" y="842" font-size="10.5" fill="#5A4F41">③ 餐厅 ↔ 玄关 · 从餐厅朝东拍落在右下</text>
  <text x="872" y="859" font-size="10.5" fill="#5A4F41">④ 卫生间门槛 D7 · 切在门内侧</text>
  <text x="872" y="878" font-size="10" fill="#7A6C59">其余（走廊、客厅、餐厅、主卧）同一批浅橡木通铺。</text>

  <path d="M872 892 L1256 892" stroke="#E6DBC7"/>

  <text x="872" y="916" font-size="12.5" font-weight="700" fill="#3E352B">机位名 14 个（见第 6 节第 6 条）</text>
  <text x="872" y="936" font-size="10" fill="#5A4F41">原 11 个 + 玄关机位、玄关门口机位、卫生间机位、台盆机位</text>
  <text x="872" y="954" font-size="10" fill="#B45309" font-weight="700">拍玄关/卫生间一律不跟拍：镜头留在门外或敞开口这一侧。</text>

  <!-- 页脚 -->
  <text x="90" y="1028" font-size="10" fill="#9A8B76">本图仅定「房间怎么连、门在哪、人怎么走」，不定家具；室内陈设以《场景资产设定_阿森家.md》第 1—4 节及 2B/2C/2D 为准。户型示意图不能作为生图输入，它给人和剧本用。</text>
